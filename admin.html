<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Artiola Studio</title>
<meta name="theme-color" content="#17121a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%2317121a'/><path d='M20 52 Q32 57 44 52 L44 30 C44 18 36 10 32 7 C28 10 20 18 20 30 Z' fill='%23b5122b'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5efe8; --paper-2:#ede4d9; --card:#fbf8f4; --ink:#17121a; --cherry:#b5122b; --blush:#f1d9d2;
    --muted:#6f6470; --line:rgba(23,18,26,.12);
    --pending:#b7791f; --confirmed:#2f7d4f; --done:#5a5f6b; --cancelled:#b5122b; --noshow:#7a4a3a;
    --serif:"Instrument Serif", Georgia, serif; --sans:"DM Sans", system-ui, -apple-system, Segoe UI, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{overflow-x:clip}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:inherit}
  .wrap{width:min(1180px,100% - 32px);margin-inline:auto}
  h1,h2{font-family:var(--serif);font-weight:400;line-height:1}
  em{font-style:italic;color:var(--cherry)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.7rem 1.1rem;border-radius:999px;border:1px solid var(--ink);background:transparent;font-weight:600;font-size:.88rem;cursor:pointer;transition:background .2s,color .2s;text-decoration:none;white-space:nowrap}
  .btn:hover{background:var(--ink);color:var(--paper)}
  .btn.ink{background:var(--ink);color:var(--paper)}
  .btn.ink:hover{background:var(--cherry);border-color:var(--cherry)}
  .btn.sm{padding:.45rem .8rem;font-size:.8rem}
  .btn.danger{border-color:var(--cherry);color:var(--cherry)}
  .btn.danger:hover{background:var(--cherry);color:#fff}
  .logo{font-family:var(--serif);font-size:1.8rem;display:flex;align-items:center;gap:.35rem;text-decoration:none}
  .logo i{width:10px;height:15px;border-radius:50% 50% 45% 45% / 70% 70% 30% 30%;background:var(--cherry);transform:rotate(8deg)}
  .logo small{font-family:var(--sans);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--muted);margin-left:.5rem}
  label{display:grid;gap:.3rem;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted)}
  input,select,textarea{font-size:.95rem;letter-spacing:0;text-transform:none;font-weight:400;background:#fff;border:1px solid var(--line);border-radius:12px;padding:.65rem .8rem;outline:none;width:100%;color:var(--ink)}
  input:focus,select:focus,textarea:focus{border-color:var(--ink)}
  textarea{resize:vertical;min-height:70px}
  [hidden]{display:none!important}

  /* LOGIN */
  .login{min-height:100vh;display:grid;place-items:center;padding:24px}
  .login-card{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:28px;padding:2.4rem 2rem;display:grid;gap:1.2rem;box-shadow:0 30px 60px -40px rgba(23,18,26,.4)}
  .login-card h1{font-size:2.8rem}
  .login-card p{color:var(--muted);font-size:.92rem}
  .msg{font-size:.85rem;color:var(--cherry);min-height:1.2em}
  .back{font-size:.85rem;color:var(--muted);text-align:center}

  /* APP */
  header.top{position:sticky;top:0;z-index:20;background:rgba(245,239,232,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .top-in{display:flex;align-items:center;justify-content:space-between;gap:1rem;height:68px}
  .top-actions{display:flex;gap:.5rem;flex-wrap:wrap}
  main{padding:2rem 0 4rem}
  .hello{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.6rem}
  .hello h1{font-size:clamp(2.4rem,5vw,3.6rem)}
  .hello p{color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin-bottom:1.6rem}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:1.1rem 1.2rem;cursor:pointer;transition:border-color .2s,transform .2s;text-align:left}
  .stat:hover{border-color:var(--ink);transform:translateY(-2px)}
  .stat b{font-family:var(--serif);font-size:2.6rem;font-weight:400;line-height:1;display:block}
  .stat span{font-size:.8rem;color:var(--muted)}
  .stat.hot b{color:var(--cherry)}

  .toolbar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1.2rem}
  .tabs{display:inline-flex;background:var(--paper-2);border-radius:999px;padding:4px}
  .tabs button{border:0;background:none;padding:.5rem 1rem;border-radius:999px;cursor:pointer;font-weight:600;font-size:.85rem}
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .toolbar input[type=search]{flex:1;min-width:180px;border-radius:999px}
  .toolbar select{width:auto;border-radius:999px}

  .day{margin-bottom:1.6rem;scroll-margin-top:84px}
  .day h3{font-family:var(--serif);font-weight:400;font-size:1.6rem;margin-bottom:.6rem;display:flex;gap:.6rem;align-items:baseline}
  .day h3 small{font-family:var(--sans);font-size:.8rem;color:var(--muted)}
  .day h3 .today{font-family:var(--sans);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;background:var(--cherry);color:#fff;padding:.2rem .5rem;border-radius:999px}
  .bk{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1rem 1.1rem;display:grid;grid-template-columns:86px 1fr auto;gap:1rem;align-items:center;margin-bottom:.6rem;cursor:pointer;transition:border-color .2s}
  .bk:hover{border-color:var(--ink)}
  .bk .when{font-weight:700;font-size:.95rem}
  .bk .when small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
  .bk .who{min-width:0}
  .bk .who b{font-size:1.02rem}
  .bk .who span{display:block;color:var(--muted);font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .pill{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.3rem .65rem;border-radius:999px;color:#fff;white-space:nowrap}
  .s-pending{background:var(--pending)} .s-confirmed{background:var(--confirmed)} .s-done{background:var(--done)} .s-cancelled{background:var(--cancelled)} .s-no-show{background:var(--noshow)}
  .empty{text-align:center;padding:4rem 1rem;color:var(--muted);border:1px dashed rgba(23,18,26,.25);border-radius:22px}
  .empty h3{font-family:var(--serif);font-weight:400;font-size:2rem;color:var(--ink);margin-bottom:.4rem}

  /* CALENDAR */
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem}
  .cal-head h2{font-size:2rem}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal .dow{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;padding:.3rem 0}
  .cell{min-height:104px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.45rem;display:flex;flex-direction:column;gap:3px;cursor:pointer;overflow:hidden}
  .cell:hover{border-color:var(--ink)}
  .cell.out{opacity:.4}
  .cell.is-today{border-color:var(--cherry);box-shadow:inset 0 0 0 1px var(--cherry)}
  .cell .n{font-size:.8rem;font-weight:700}
  .cell .ev{font-size:.72rem;padding:2px 6px;border-radius:6px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell .more{font-size:.7rem;color:var(--muted)}

  /* DRAWER */
  .scrim{position:fixed;inset:0;background:rgba(23,18,26,.4);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{visibility:hidden;position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--paper);z-index:50;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column}
  .drawer.open{transform:none;visibility:visible}
  .d-head{display:flex;justify-content:space-between;align-items:center;padding:1.2rem 1.4rem;border-bottom:1px solid var(--line)}
  .d-head h2{font-size:2rem}
  .d-body{padding:1.4rem;overflow:auto;display:grid;gap:1rem;align-content:start;flex:1}
  .d-foot{padding:1rem 1.4rem;border-top:1px solid var(--line);display:flex;gap:.5rem;justify-content:space-between;flex-wrap:wrap}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.8rem}
  .quick{display:flex;gap:.4rem;flex-wrap:wrap}
  .meta{font-size:.8rem;color:var(--muted)}
  .status-row{display:flex;gap:.4rem;flex-wrap:wrap}
  .status-row button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.4rem .8rem;font-size:.8rem;font-weight:600;cursor:pointer;text-transform:capitalize}
  .status-row button[aria-pressed="true"]{color:#fff;border-color:transparent}
  .x{width:40px;height:40px;border-radius:50%;border:1px solid var(--ink);background:none;cursor:pointer;font-size:1.2rem}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120%);background:var(--ink);color:var(--paper);padding:.8rem 1.2rem;border-radius:999px;font-size:.9rem;z-index:60;transition:transform .3s}
  .toast.show{transform:translateX(-50%)}
  .notice{background:#fff7e6;border:1px solid #f0d9a8;color:#7a5a12;border-radius:16px;padding:1rem 1.2rem;margin-bottom:1.2rem;font-size:.9rem}

  @media (max-width:820px){
    .stats{grid-template-columns:1fr 1fr}
    .bk{grid-template-columns:70px 1fr;gap:.6rem 1rem}
    .bk .pill{grid-column:2;justify-self:start}
    .cell{min-height:64px}
    .cell .ev{font-size:0;height:6px;padding:0}
    .top-actions .hide-sm,.logo small{display:none}
    .top-actions .btn{padding:.45rem .75rem}
    .hello h1{font-size:2.4rem}
    .day h3{flex-wrap:wrap}
    .toolbar .tabs{width:100%}
    .toolbar .tabs button{flex:1}
    .toolbar select{flex:1}
    .row3{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<section class="login" id="loginView" hidden>
  <form class="login-card" id="loginForm">
    <a class="logo" href="/">Artiola<i></i><small>Studio</small></a>
    <h1>Welcome <em>back</em>.</h1>
    <p>Log in to see your reservations.</p>
    <label>Password<input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <button class="btn ink" type="submit">Log in →</button>
    <p class="msg" id="loginMsg" role="alert"></p>
    <a class="back" href="/">← Back to website</a>
  </form>
</section>

<!-- APP -->
<div id="appView" hidden>
  <header class="top">
    <div class="wrap top-in">
      <a class="logo" href="/">Artiola<i></i><small>Studio</small></a>
      <div class="top-actions">
        <button class="btn ink sm" id="addBtn">+ New booking</button>
        <button class="btn sm hide-sm" id="csvBtn">Export CSV</button>
        <button class="btn sm" id="logoutBtn">Log out</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="notice" id="storageNotice" hidden></div>
    <div class="hello">
      <div>
        <h1 id="greet">Hello, <em>Artiola</em>.</h1>
        <p id="subline">Here's what's coming up.</p>
      </div>
      <button class="btn sm" id="refreshBtn">↻ Refresh</button>
    </div>

    <div class="stats">
      <button class="stat hot" data-quick="pending"><b id="stPending">0</b><span>New requests</span></button>
      <button class="stat" data-quick="today"><b id="stToday">0</b><span>Today</span></button>
      <button class="stat" data-quick="week"><b id="stWeek">0</b><span>Next 7 days</span></button>
      <button class="stat" data-quick="all"><b id="stAll">0</b><span>All bookings</span></button>
    </div>

    <div class="toolbar">
      <div class="tabs" role="group" aria-label="View">
        <button data-view="list" aria-pressed="true">List</button>
        <button data-view="calendar" aria-pressed="false">Calendar</button>
      </div>
      <input type="search" id="q" placeholder="Search name, phone, service…">
      <select id="fStatus">
        <option value="active">Upcoming (pending + confirmed)</option>
        <option value="all">All statuses</option>
        <option value="pending">Pending</option>
        <option value="confirmed">Confirmed</option>
        <option value="done">Done</option>
        <option value="cancelled">Cancelled</option>
        <option value="no-show">No-show</option>
      </select>
      <select id="fRange">
        <option value="upcoming">From today</option>
        <option value="all">Any date</option>
        <option value="past">Past</option>
        <option value="nodate">No date yet</option>
      </select>
    </div>

    <div id="listView"></div>
    <div id="calView" hidden>
      <div class="cal-head">
        <button class="btn sm" id="prevM">←</button>
        <h2 id="calTitle"></h2>
        <button class="btn sm" id="nextM">→</button>
      </div>
      <div class="cal" id="cal"></div>
    </div>
  </main>
</div>

<!-- DRAWER -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Booking details">
  <div class="d-head"><h2 id="dTitle">Booking</h2><button class="x" id="dClose" aria-label="Close">×</button></div>
  <form class="d-body" id="dForm">
    <div>
      <label style="margin-bottom:.4rem">Status</label>
      <div class="status-row" id="dStatus"></div>
    </div>
    <div class="row2">
      <label>Name<input name="name" required maxlength="80"></label>
      <label>Service
        <select name="service">
          <option>Gel manicure</option><option>BIAB / builder gel</option><option>Extensions</option>
          <option>Nail art</option><option>Pedicure</option><option>Removal &amp; repair</option>
        </select>
      </label>
    </div>
    <div class="row2">
      <label>Phone<input name="phone" type="tel" maxlength="40"></label>
      <label>Instagram<input name="instagram" maxlength="60" placeholder="@handle"></label>
    </div>
    <div class="quick" id="dQuick"></div>
    <div class="row3">
      <label>Date<input name="date" type="date"></label>
      <label>Time<input name="clock" type="time" step="900"></label>
      <label>Part of day<select name="time"><option value="">—</option><option>Morning</option><option>Afternoon</option><option>Evening</option></select></label>
    </div>
    <div class="row2">
      <label>Design<input name="design" maxlength="160"></label>
      <label>Price<input name="price" maxlength="20" placeholder="e.g. 35€"></label>
    </div>
    <label>Client notes<textarea name="notes" maxlength="1000"></textarea></label>
    <label>Studio notes (private)<textarea name="studioNotes" maxlength="1000" placeholder="Only you see this"></textarea></label>
    <p class="meta" id="dMeta"></p>
  </form>
  <div class="d-foot">
    <button class="btn danger sm" id="dDelete">Delete</button>
    <div style="display:flex;gap:.5rem">
      <button class="btn sm" id="dCancel">Close</button>
      <button class="btn ink sm" id="dSave">Save</button>
    </div>
  </div>
</aside>

<div class="toast" id="toast" role="status"></div>

<script>
  const $ = id => document.getElementById(id);
  const STATUS = ["pending","confirmed","done","cancelled","no-show"];
  const COLORS = {pending:"var(--pending)",confirmed:"var(--confirmed)",done:"var(--done)",cancelled:"var(--cancelled)","no-show":"var(--noshow)"};
  let bookings = [], view = "list", calMonth = new Date(), editing = null, editStatus = "pending";

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const todayIso = () => iso(new Date());
  const addDays = (s, n) => { const d = new Date(s + "T12:00"); d.setDate(d.getDate() + n); return iso(d); };
  const fmtDay = s => new Date(s + "T12:00").toLocaleDateString(undefined, {weekday:"long", day:"numeric", month:"long"});
  const toast = t => { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2400); };

  async function api(path, opts = {}) {
    const r = await fetch(path, {credentials:"same-origin", headers:{"Content-Type":"application/json"}, ...opts});
    const data = await r.json().catch(() => ({}));
    if (r.status === 401 && path !== "/api/login") { show("login"); throw new Error("Please log in."); }
    if (!r.ok) throw new Error(data.error || `Error ${r.status}`);
    return data;
  }

  function show(which) {
    $("loginView").hidden = which !== "login";
    $("appView").hidden = which !== "app";
    if (which === "login") setTimeout(() => $("loginForm").password.focus(), 50);
  }

  /* ---- auth ---- */
  $("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    $("loginMsg").textContent = "";
    try {
      await api("/api/login", {method:"POST", body: JSON.stringify({password: e.target.password.value})});
      e.target.reset(); show("app"); load();
    } catch (err) { $("loginMsg").textContent = err.message; }
  });
  $("logoutBtn").onclick = async () => { await api("/api/login", {method:"DELETE"}).catch(()=>{}); bookings = []; show("login"); };

  /* ---- data ---- */
  async function load() {
    try {
      const data = await api("/api/bookings");
      bookings = data.bookings || [];
      render();
    } catch (err) { if (err.message !== "Please log in.") toast(err.message); }
  }
  $("refreshBtn").onclick = () => load().then(() => toast("Up to date"));

  function filtered() {
    const q = $("q").value.trim().toLowerCase();
    const st = $("fStatus").value, rg = $("fRange").value, t = todayIso();
    return bookings.filter(b => {
      if (st === "active" && !["pending","confirmed"].includes(b.status)) return false;
      if (!["active","all"].includes(st) && b.status !== st) return false;
      if (rg === "upcoming" && b.date && b.date < t) return false;
      if (rg === "past" && (!b.date || b.date >= t)) return false;
      if (rg === "nodate" && b.date) return false;
      if (q && ![b.name,b.phone,b.instagram,b.service,b.design,b.notes,b.studioNotes].join(" ").toLowerCase().includes(q)) return false;
      return true;
    });
  }

  function render() {
    const t = todayIso(), wk = addDays(t, 7);
    const live = bookings.filter(b => !["cancelled","no-show"].includes(b.status));
    $("stPending").textContent = bookings.filter(b => b.status === "pending").length;
    $("stToday").textContent = live.filter(b => b.date === t).length;
    $("stWeek").textContent = live.filter(b => b.date && b.date >= t && b.date < wk).length;
    $("stAll").textContent = bookings.length;
    const todays = live.filter(b => b.date === t).length;
    $("subline").textContent = todays ? `You have ${todays} appointment${todays>1?"s":""} today.` : "No appointments today — here's what's coming up.";
    view === "list" ? renderList() : renderCal();
  }

  function card(b) {
    const when = b.clock || b.time || "—";
    const sub = [b.service, b.design].filter(Boolean).join(" · ");
    return `<div class="bk" data-id="${esc(b.id)}" tabindex="0">
      <div class="when">${esc(when)}${b.clock && b.time ? `<small>${esc(b.time)}</small>` : ""}</div>
      <div class="who"><b>${esc(b.name)}</b><span>${esc(sub)}${b.phone ? " · " + esc(b.phone) : ""}${b.instagram ? " · @" + esc(b.instagram) : ""}</span></div>
      <span class="pill s-${esc(b.status)}">${esc(b.status)}</span>
    </div>`;
  }

  function renderList() {
    const list = filtered();
    if (!list.length) {
      $("listView").innerHTML = `<div class="empty"><h3>Nothing here yet</h3><p>${bookings.length ? "Try another filter." : "New booking requests from the website will appear here."}</p></div>`;
      return;
    }
    const groups = new Map();
    for (const b of list) { const k = b.date || "nodate"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(b); }
    const t = todayIso();
    $("listView").innerHTML = [...groups].map(([day, items]) => `
      <div class="day" data-day="${esc(day)}">
        <h3>${day === "nodate" ? "No date yet" : esc(fmtDay(day))}${day === t ? '<span class="today">Today</span>' : ""}<small>${items.length} booking${items.length>1?"s":""}</small></h3>
        ${items.map(card).join("")}
      </div>`).join("");
  }

  function renderCal() {
    const y = calMonth.getFullYear(), m = calMonth.getMonth();
    $("calTitle").innerHTML = calMonth.toLocaleDateString(undefined, {month:"long"}) + ` <em>${y}</em>`;
    const first = new Date(y, m, 1), start = new Date(first);
    start.setDate(1 - ((first.getDay() + 6) % 7)); // Monday first
    const list = filtered(), t = todayIso();
    const dows = [...Array(7)].map((_, i) => new Date(2024, 0, 1 + i).toLocaleDateString(undefined, {weekday:"short"}));
    let html = dows.map(d => `<div class="dow">${d}</div>`).join("");
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const k = iso(d), items = list.filter(b => b.date === k);
      html += `<div class="cell${d.getMonth() !== m ? " out" : ""}${k === t ? " is-today" : ""}" data-day="${k}">
        <span class="n">${d.getDate()}</span>
        ${items.slice(0,3).map(b => `<span class="ev" style="background:${COLORS[b.status]}" data-id="${esc(b.id)}">${esc(b.clock || "")} ${esc(b.name)}</span>`).join("")}
        ${items.length > 3 ? `<span class="more">+${items.length-3} more</span>` : ""}
      </div>`;
    }
    $("cal").innerHTML = html;
  }

  $("prevM").onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); renderCal(); };
  $("nextM").onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); renderCal(); };

  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
    view = b.dataset.view;
    document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-pressed", x === b));
    $("listView").hidden = view !== "list"; $("calView").hidden = view !== "calendar";
    if (view === "calendar") { $("fRange").value = "all"; }
    render();
  });
  ["q","fStatus","fRange"].forEach(id => $(id).addEventListener("input", render));
  document.querySelectorAll("[data-quick]").forEach(b => b.onclick = () => {
    const k = b.dataset.quick; $("q").value = "";
    if (k === "pending") { $("fStatus").value = "pending"; $("fRange").value = "all"; }
    if (k === "today" || k === "week") { $("fStatus").value = "active"; $("fRange").value = "upcoming"; }
    if (k === "all") { $("fStatus").value = "all"; $("fRange").value = "all"; }
    document.querySelector('.tabs button[data-view="list"]').click();
  });

  $("listView").addEventListener("click", e => { const c = e.target.closest(".bk"); if (c) openDrawer(c.dataset.id); });
  $("listView").addEventListener("keydown", e => { const c = e.target.closest(".bk"); if (c && e.key === "Enter") openDrawer(c.dataset.id); });
  $("cal").addEventListener("click", e => {
    const ev = e.target.closest(".ev"); if (ev) return openDrawer(ev.dataset.id);
    const cell = e.target.closest(".cell"); if (!cell) return;
    const n = bookings.filter(b => b.date === cell.dataset.day).length;
    if (n) {
      $("q").value = ""; $("fStatus").value = "all"; $("fRange").value = "all";
      document.querySelector('.tabs button[data-view="list"]').click();
      document.querySelector(`.day[data-day="${cell.dataset.day}"]`)?.scrollIntoView({behavior:"smooth", block:"start"});
    } else openDrawer(null, cell.dataset.day);
  });

  /* ---- drawer ---- */
  function setStatus(s) {
    editStatus = s;
    $("dStatus").innerHTML = STATUS.map(x => `<button type="button" data-s="${x}" aria-pressed="${x===s}" style="${x===s ? `background:${COLORS[x]}` : ""}">${x}</button>`).join("");
  }
  $("dStatus").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setStatus(b.dataset.s); });

  function openDrawer(id, day) {
    const f = $("dForm"); f.reset();
    editing = id ? bookings.find(b => b.id === id) : null;
    const b = editing || {status:"confirmed", date: day || "", service:"Gel manicure"};
    $("dTitle").innerHTML = editing ? esc(b.name) : "New <em>booking</em>";
    for (const k of ["name","service","phone","instagram","date","clock","time","design","price","notes","studioNotes"]) if (f[k]) f[k].value = b[k] || "";
    setStatus(b.status);
    const phone = (b.phone || "").replace(/[^\d+]/g, "");
    $("dQuick").innerHTML = editing ? [
      phone && `<a class="btn sm" href="tel:${esc(phone)}">Call</a>`,
      phone && `<a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/${esc(phone.replace(/^\+/, ""))}?text=${encodeURIComponent(`Hi ${b.name}! This is Artiola 💅 `)}">WhatsApp</a>`,
      b.instagram && `<a class="btn sm" target="_blank" rel="noopener" href="https://ig.me/m/${esc(b.instagram)}">Instagram DM</a>`,
    ].filter(Boolean).join("") : "";
    $("dMeta").textContent = editing ? `Received ${new Date(b.createdAt).toLocaleString()} via ${b.source}${b.updatedAt ? ` · updated ${new Date(b.updatedAt).toLocaleString()}` : ""}` : "";
    $("dDelete").hidden = !editing;
    $("scrim").classList.add("open"); $("drawer").classList.add("open");
    setTimeout(() => f.name.focus(), 250);
  }
  function closeDrawer() { $("scrim").classList.remove("open"); $("drawer").classList.remove("open"); editing = null; }
  $("dClose").onclick = $("dCancel").onclick = $("scrim").onclick = closeDrawer;
  addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
  $("addBtn").onclick = () => openDrawer(null);

  $("dSave").onclick = async () => {
    const f = $("dForm");
    if (!f.name.value.trim()) { f.name.focus(); return toast("Add a name"); }
    const body = Object.fromEntries(new FormData(f)); body.status = editStatus;
    try {
      if (editing) { body.id = editing.id; await api("/api/bookings", {method:"PATCH", body: JSON.stringify(body)}); }
      else await api("/api/bookings", {method:"POST", body: JSON.stringify({...body, source:"studio"})});
      closeDrawer(); await load(); toast("Saved");
    } catch (err) { toast(err.message); }
  };
  $("dDelete").onclick = async () => {
    if (!editing || !confirm(`Delete the booking for ${editing.name}? This can't be undone.`)) return;
    try { await api(`/api/bookings?id=${encodeURIComponent(editing.id)}`, {method:"DELETE"}); closeDrawer(); await load(); toast("Deleted"); }
    catch (err) { toast(err.message); }
  };

  /* ---- CSV ---- */
  $("csvBtn").onclick = () => {
    const cols = ["date","clock","time","status","name","phone","instagram","service","design","price","notes","studioNotes","source","createdAt"];
    const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const csv = [cols.join(","), ...bookings.map(b => cols.map(c => cell(b[c])).join(","))].join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + csv], {type:"text/csv"}));
    a.download = `artiola-bookings-${todayIso()}.csv`; a.click();
  };

  /* ---- start ---- */
  (async () => {
    try {
      const s = await api("/api/login");
      if (!s.configured || !s.storage) {
        $("storageNotice").hidden = false;
        $("storageNotice").textContent = !s.configured
          ? "Studio login isn't set up yet: add ADMIN_PASSWORD in Vercel → Settings → Environment Variables, then redeploy."
          : "Bookings storage isn't connected yet: add the Upstash Redis integration in Vercel → Storage, then redeploy.";
      }
      if (s.loggedIn) { show("app"); load(); } else show("login");
      if (!s.configured) { $("loginMsg").textContent = "Login isn't set up yet — add ADMIN_PASSWORD in Vercel."; }
    } catch { show("login"); $("loginMsg").textContent = "Can't reach the server. Open this page on the live site."; }
  })();
</script>
</body>
</html>
